    <title>GLB Optimizer</title>
    <style>:root {
  color-scheme: dark;
  --bg: #101211;
  --panel: #191d1b;
  --panel-2: #202522;
  --line: #344039;
  --text: #eef3ee;
  --muted: #aab7ad;
  --accent: #45c0a2;
  --accent-2: #e2b65d;
  --danger: #f07167;
  --ok: #79d184;
  --ink: #071411;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, Segoe UI, Arial, sans-serif;
}

button,
select {
  font: inherit;
}

.app {
  min-height: 100vh;
  padding: 18px;
}

.workbench {
  min-height: calc(100vh - 36px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.topbar {
  min-height: 64px;
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto minmax(320px, auto);
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 14px;
}

h1 {
  margin: 0;
  font-size: 24px;
  line-height: 1.1;
  font-weight: 700;
}

p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.health-badge {
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ok);
  padding: 0 10px;
  font-size: 12px;
  white-space: nowrap;
}

.health-badge.offline {
  color: var(--danger);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

button,
select {
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--text);
  padding: 0 12px;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

button:not(:disabled):hover,
select:hover,
.file-actions a:hover {
  border-color: var(--accent);
}

#optimizeButton {
  background: var(--accent);
  color: var(--ink);
  border-color: var(--accent);
  font-weight: 700;
}

.main-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(300px, 430px) minmax(0, 1fr);
  gap: 14px;
}

.queue-panel {
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.drop-zone {
  min-height: 118px;
  display: grid;
  place-content: center;
  gap: 6px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 8px;
  background: var(--panel);
  cursor: pointer;
}

.drop-zone.drag-over {
  border-color: var(--accent);
  background: #1a2a25;
}

.drop-title {
  font-size: 18px;
  font-weight: 700;
}

.drop-meta {
  color: var(--muted);
  font-size: 13px;
}

#fileInput {
  display: none;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.metrics div {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 9px 10px;
}

.metrics strong,
.metrics span {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.metrics strong {
  font-size: 15px;
}

.metrics span {
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
}

.queue-list {
  min-height: 120px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.file-row {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 10px;
  display: grid;
  gap: 8px;
}

.file-row.active {
  border-color: var(--accent-2);
}

.file-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.file-name {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 13px;
  font-weight: 700;
}

.file-state {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 12px;
  text-transform: capitalize;
}

.file-meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
}

.file-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.file-actions button,
.file-actions a {
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--text);
  padding: 0 10px;
  text-decoration: none;
  font-size: 12px;
}

.status-done {
  color: var(--ok);
}

.status-failed {
  color: var(--danger);
}

.job-log {
  height: 150px;
  margin: 0;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0d100f;
  color: var(--muted);
  padding: 10px;
  font-family: Consolas, ui-monospace, monospace;
  font-size: 11px;
  line-height: 1.45;
  white-space: pre-wrap;
}

.job-log:empty {
  display: none;
}

.viewer-shell {
  position: relative;
  min-height: 420px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #111614;
}

#viewerCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

.viewer-tools {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 8px;
}

.viewer-tools button {
  height: 32px;
  background: rgba(32, 37, 34, 0.82);
  backdrop-filter: blur(8px);
}

.viewer-hud {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid rgba(238, 243, 238, 0.16);
  border-radius: 8px;
  background: rgba(16, 18, 17, 0.72);
  backdrop-filter: blur(8px);
  font-size: 13px;
}

#viewerName {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#viewerStats {
  flex: 0 0 auto;
  color: var(--muted);
}

@media (max-width: 960px) {
  .topbar {
    align-items: stretch;
    grid-template-columns: 1fr;
  }

  .toolbar {
    justify-content: stretch;
  }

  .toolbar > * {
    flex: 1 1 140px;
  }

  .main-grid {
    grid-template-columns: 1fr;
  }

  .viewer-shell {
    min-height: 52vh;
  }
}

@media (max-width: 540px) {
  .app {
    padding: 12px;
  }

  .metrics {
    grid-template-columns: 1fr;
  }
}

.main-grid{align-items:start}.viewer-shell{height:calc(100vh - 165px);min-height:420px;border:0;border-radius:0}.queue-list{max-height:52vh}.file-meta{flex-wrap:wrap}.file-state{max-width:45%;overflow-wrap:anywhere}.topbar{grid-template-columns: minmax(160px,1fr) auto}.toolbar{grid-column:1 / -1}button:focus-visible,a:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}@media(max-width:960px){.viewer-shell{height:52vh}.topbar{grid-template-columns:1fr}.queue-list{max-height:35vh}}@media(max-width:540px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}</style>
  </head>
  <body>
    <main class="app">
      <section class="workbench" aria-label="GLB optimizer">
        <div class="topbar">
          <div>
            <h1>GLB Optimizer</h1>
            <p id="statusText">Ready</p>
          </div>
          <div id="healthBadge" class="health-badge">Offline</div>
          <div class="toolbar">
            <select id="presetSelect" aria-label="Preset"></select>
            <button id="pickButton" type="button">Add GLB</button>
            <button id="clearButton" type="button" disabled>Clear</button>
            <button id="optimizeButton" type="button" disabled>Optimize</button>
            <button id="stopButton" type="button" disabled>Stop</button>
            <button id="downloadAllButton" type="button" disabled>Download all</button>
          </div>
        </div>

        <div class="main-grid">
          <aside class="queue-panel">
            <label id="dropZone" class="drop-zone" for="fileInput">
              <span class="drop-title">Drop GLB files</span>
              <span class="drop-meta">or select them from disk</span>
            </label>
            <input id="fileInput" type="file" accept=".glb,model/gltf-binary" multiple>
            <div class="metrics" aria-label="Queue summary">
              <div>
                <strong id="fileCount">0</strong>
                <span>Files</span>
              </div>
              <div>
                <strong id="inputTotal">0 MB</strong>
                <span>Input</span>
              </div>
              <div>
                <strong id="savedTotal">0 MB</strong>
                <span>Saved</span>
              </div>
            </div>
            <div id="queueList" class="queue-list" aria-live="polite"></div>
            <pre id="jobLog" class="job-log" aria-live="polite"></pre>
          </aside>

          <section class="viewer-shell">
            <canvas id="viewerCanvas"></canvas>
            <div class="viewer-tools">
              <button id="fitButton" type="button">Fit</button>
            </div>
            <div class="viewer-hud">
              <span id="viewerName">No model loaded</span>
              <span id="viewerStats">0 MB</span>
            </div>
          </section>
        </div>
      </section>
    </main>
